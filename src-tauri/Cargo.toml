[package]
name = "nekodesk"
version = "0.1.0"
description = "NekoDesk — ASCII cat pet + personal dashboard"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nekodesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
# bundled-sqlcipher: 대화 DB 암호화. OPENSSL_DIR 이 없으면 macOS 내장 CommonCrypto 로 빌드된다
# (Homebrew openssl 에 링크되면 다른 맥에서 안 뜬다 — OPENSSL_DIR 을 설정하지 마라).
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.22"
dirs = "5"
base64 = "0.22"
thiserror = "1"
# fs.glob / fs.grep — gitignore 를 존중하는 워크와 패턴 매칭.
ignore = "0.4"
globset = "0.4"
regex = "1"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-updater = "2"
# 기기 간 동기화(sync/): 기록마다 XChaCha20-Poly1305 로 잠근다. 암호를 손으로 짜지 않는다(docs/neko-sync.md §3.1).
chacha20poly1305 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
# NSHapticFeedbackManager 호출용. tauri 가 이미 쓰는 버전이라 추가 빌드 비용 없음.
objc2 = "0.6"
# 날씨용 현재 위치(CLLocationManager). tauri 가 이미 lock 에 올려둔 objc2 0.3 계열.
objc2-foundation = "0.3"
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }
# 네코 산책 지도(map.rs). 키 없이 쓰는 네이티브 MapKit. app-kit·block2 는 tauri 가 이미 lock 에 올려둔 버전.
objc2-map-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-location", "MKAnnotation", "MKDirections", "MKDirectionsRequest", "MKDirectionsResponse", "MKDirectionsTypes", "MKGeometry", "MKLocalSearch", "MKLocalSearchRequest", "MKLocalSearchResponse", "MKMapItem", "MKMapSnapshot", "MKMapSnapshotOptions", "MKMapSnapshotter", "MKMultiPoint", "MKPlacemark", "MKPointOfInterestCategory", "MKPointOfInterestFilter", "MKPolyline", "MKShape", "MKTypes"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep"] }
block2 = "0.6"
# API 키를 키체인에 둔다(secrets.rs). 업데이트 쪽이 이미 lock 에 올려둔 버전이다.
security-framework = "3"
