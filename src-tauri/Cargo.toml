[package]
name = "nekodesk"
version = "0.1.0"
description = "NekoDesk — ASCII cat pet + personal dashboard"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nekodesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
# bundled-sqlcipher: 대화 DB 암호화. OPENSSL_DIR 이 없으면 macOS 내장 CommonCrypto 로 빌드된다
# (Homebrew openssl 에 링크되면 다른 맥에서 안 뜬다 — OPENSSL_DIR 을 설정하지 마라).
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.22"
dirs = "5"
base64 = "0.22"
thiserror = "1"
# fs.glob / fs.grep — gitignore 를 존중하는 워크와 패턴 매칭.
ignore = "0.4"
globset = "0.4"
regex = "1"
tauri-plugin-notification = "2"
# 기기 간 동기화(sync/): 기록마다 XChaCha20-Poly1305 로 잠근다. 암호를 손으로 짜지 않는다(docs/neko-sync.md §3.1).
chacha20poly1305 = "0.10"

# 데스크탑 전용 플러그인(빠른 질문 단축키·보관함 끌어내기·자동 업데이트). 폰(iOS) 빌드에는 없다.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-updater = "2"
# 기기 연결 코드를 QR 로 그린다(sync/run.rs pair_qr) — 긴 코드를 폰에 손으로 칠 수 없다. 그림 의존 없이 SVG 글만 만든다.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# API 키·DB 열쇠·동기화 열쇠를 키체인에 둔다(secrets.rs). 업데이트 쪽이 이미 lock 에 올려둔 버전이다. iOS 키체인도 같은 API.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"
# 맥: NSHapticFeedbackManager 등. 폰: 웹뷰 스크롤 뷰 설정(lib.rs ios_full_screen). tauri 가 이미 쓰는 버전이라 추가 빌드 비용 없음.
objc2 = "0.6"
# objc 블록(맥: 지도 콜백, 폰: 음악 보관함 권한 답, music_ios.rs). tauri 가 이미 lock 에 올려둔 버전.
block2 = "0.6"

# 네코 산책 지도(map.rs): 폰도 같은 MapKit 으로 지도 그림·장소·걷기 경로를 만든다. 그림을 PNG 로 굽는 곳만 다르다
# (맥 NSImage, 폰 UIImage — 폰 쪽은 objc 로 바로 부른다). 맥 쪽 표에 같은 크레이트를 app-kit 과 함께 다시 적는다.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = "0.3"
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }
objc2-map-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-location", "MKAnnotation", "MKDirections", "MKDirectionsRequest", "MKDirectionsResponse", "MKDirectionsTypes", "MKGeometry", "MKLocalSearch", "MKLocalSearchRequest", "MKLocalSearchResponse", "MKMapItem", "MKMapSnapshot", "MKMapSnapshotOptions", "MKMapSnapshotter", "MKMultiPoint", "MKPlacemark", "MKPointOfInterestCategory", "MKPointOfInterestFilter", "MKPolyline", "MKShape", "MKTypes"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 날씨용 현재 위치(CLLocationManager). tauri 가 이미 lock 에 올려둔 objc2 0.3 계열.
objc2-foundation = "0.3"
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }
# 네코 산책 지도(map.rs). 키 없이 쓰는 네이티브 MapKit. app-kit·block2 는 tauri 가 이미 lock 에 올려둔 버전.
objc2-map-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-location", "MKAnnotation", "MKDirections", "MKDirectionsRequest", "MKDirectionsResponse", "MKDirectionsTypes", "MKGeometry", "MKLocalSearch", "MKLocalSearchRequest", "MKLocalSearchResponse", "MKMapItem", "MKMapSnapshot", "MKMapSnapshotOptions", "MKMapSnapshotter", "MKMultiPoint", "MKPlacemark", "MKPointOfInterestCategory", "MKPointOfInterestFilter", "MKPolyline", "MKShape", "MKTypes"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep"] }
